<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Inicio Personalizada</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom right, #1e3c72, #2a5298);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 3rem;
      margin: 0;
    }
    .clock {
      font-size: 2rem;
      margin: 20px 0;
    }
    .quote {
      font-style: italic;
      margin: 20px 0;
      font-size: 1.2rem;
    }
    .links {
      display: flex;
      gap: 20px;
      margin-top: 30px;
    }
    .link {
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .link:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <h1>¡Bienvenido!</h1>
  <div class="clock" id="clock">Cargando hora...</div>
  <div class="quote" id="quote">"La única manera de hacer un gran trabajo es amar lo que haces." – Steve Jobs</div>
  <div class="links">
    <a class="link" href="https://www.google.com" target="_blank">Google</a>
    <a class="link" href="https://www.github.com" target="_blank">GitHub</a>
    <a class="link" href="https://www.drive.google.com" target="_blank">Drive</a>
  </div>

  <script>
    // Actualización del reloj
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
